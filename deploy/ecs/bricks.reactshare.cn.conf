map $arg_route $legox_campaign_route {
    default "";
    start start;
    build build;
    plaza plaza;
    work work;
}

map $arg_from $legox_campaign_from {
    default "";
    start start;
    build build;
    plaza plaza;
    work work;
}

map $arg_utm_source $legox_campaign_source {
    "" "";
    "~^[A-Za-z0-9._-]{1,64}$" $arg_utm_source;
    default other;
}

map $arg_utm_medium $legox_campaign_medium {
    "" "";
    "~^[A-Za-z0-9._-]{1,64}$" $arg_utm_medium;
    default other;
}

map $arg_utm_campaign $legox_campaign_name {
    "" "";
    "~^[A-Za-z0-9._-]{1,80}$" $arg_utm_campaign;
    default other;
}

map $arg_utm_content $legox_campaign_content {
    "" "";
    "~^[A-Za-z0-9._-]{1,80}$" $arg_utm_content;
    default other;
}

map $arg_referrer_host $legox_campaign_referrer_host {
    "" "";
    "~^[A-Za-z0-9.-]{1,253}$" $arg_referrer_host;
    default "";
}

map $http_user_agent $legox_campaign_bot {
    default 0;
    "" 1;
    ~*(bot|crawler|spider|slurp|preview|facebookexternalhit|whatsapp|telegram|discord|slack|chatgpt-user|curl|wget|python|httpclient|go-http-client|node-fetch|axios|headless|lighthouse|pagespeed|uptime|monitor) 1;
}

map "$http_sec_fetch_site|$http_origin|$http_referer" $legox_campaign_first_party {
    default 0;
    ~^same-origin\| 1;
    ~^\|https://bricks\.reactshare\.cn\| 1;
    ~^\|\|https://bricks\.reactshare\.cn(?:/|$) 1;
}

map "$request_method:$legox_campaign_route:$legox_campaign_bot:$legox_campaign_first_party" $legox_campaign_loggable {
    default 0;
    ~^POST:(?:start|build|plaza|work):0:1$ 1;
}

map "$legox_campaign_from:$legox_campaign_route" $legox_campaign_transition {
    default "";
    start:build start_to_build;
}

log_format legox_campaign escape=json
    '{"v":1,"ts":"$time_iso8601","route":"$legox_campaign_route",'
    '"from":"$legox_campaign_from","transition":"$legox_campaign_transition",'
    '"utm_source":"$legox_campaign_source","utm_medium":"$legox_campaign_medium",'
    '"utm_campaign":"$legox_campaign_name","utm_content":"$legox_campaign_content",'
    '"referrer_host":"$legox_campaign_referrer_host","status":$status}';

server {
    listen 80;
    server_name bricks.reactshare.cn;

    root /home/wwwroot/bricks.reactshare.cn/dist;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bricks.reactshare.cn;

    root /home/wwwroot/bricks.reactshare.cn/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/bricks.reactshare.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bricks.reactshare.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    access_log /home/wwwlogs/bricks.reactshare.cn.access.log main;
    error_log /home/wwwlogs/bricks.reactshare.cn.error.log;

    location = /__campaign/page {
        if ($request_method != POST) { return 405; }
        access_log /home/wwwlogs/bricks.reactshare.cn.campaign.jsonl legox_campaign if=$legox_campaign_loggable;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 204;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* ^/assets/.+\.(?:js|css|woff2?|png|jpe?g|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /digital-bricks-modeling-skill.md {
        default_type text/markdown;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/(?:start|plaza)/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~ ^/(?:build|account)/?$ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files /index.html =404;
    }

    location ~ ^/(?:w|u)/[^/]+/?$ {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

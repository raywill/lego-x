server {
    listen 80;
    server_name bricks.reactshare.cn;

    root /home/wwwroot/bricks.reactshare.cn/dist;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bricks.reactshare.cn;

    root /home/wwwroot/bricks.reactshare.cn/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/bricks.reactshare.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bricks.reactshare.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /home/wwwlogs/bricks.reactshare.cn.access.log main;
    error_log /home/wwwlogs/bricks.reactshare.cn.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
